spring.application.name=Backend
server.port=${PORT:8081}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/spring}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Sets the maximum size for a single file (e.g., 50MB)
spring.servlet.multipart.max-file-size=50MB
# Sets the maximum size for the entire request, which should be slightly larger than max-file-size
spring.servlet.multipart.max-request-size=50MB
# Enable multipart uploads
spring.servlet.multipart.enabled=true

